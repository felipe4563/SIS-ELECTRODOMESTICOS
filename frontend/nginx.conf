server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React Router — todas las rutas sirven index.html, nunca se cachea
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    # Service worker y su manifest: NUNCA se cachean. Son los archivos que el
    # navegador revisa para detectar una versión nueva de la app (byte a
    # byte); si quedan atrapados en el cache de 1 año de la regla de abajo
    # (matchean por extensión .js), el navegador jamás se entera de que hay
    # una actualización hasta que el usuario fuerza un hard refresh.
    location ~* ^/(sw\.js|workbox-.*\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Cache largo para assets con hash (vite genera nombres únicos)
    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
