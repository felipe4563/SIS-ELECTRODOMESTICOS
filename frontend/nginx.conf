server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React Router — todas las rutas caen en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache largo para assets con hash (vite genera nombres únicos)
    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
