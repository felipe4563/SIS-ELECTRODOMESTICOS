# ─────────────────────────────────────────────────────────────────────────────
# Nginx — megaelectra.arletgroup.com  (Catálogo Next.js 16 SSR)
#
# Pasos en el servidor:
#   sudo cp nginx-catalogo.conf /etc/nginx/sites-available/megaelectra.arletgroup.com
#   sudo ln -s /etc/nginx/sites-available/megaelectra.arletgroup.com \
#              /etc/nginx/sites-enabled/megaelectra.arletgroup.com
#   sudo nginx -t
#   sudo systemctl reload nginx
#   sudo certbot --nginx -d megaelectra.arletgroup.com
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name megaelectra.arletgroup.com;

    # Certbot redirige a HTTPS; este bloque lo crea automáticamente
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name megaelectra.arletgroup.com;

    # ── SSL (Certbot los rellena automáticamente) ─────────────────────────
    ssl_certificate     /etc/letsencrypt/live/megaelectra.arletgroup.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/megaelectra.arletgroup.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Logs ──────────────────────────────────────────────────────────────
    access_log /var/log/nginx/megaelectra-catalogo.access.log;
    error_log  /var/log/nginx/megaelectra-catalogo.error.log;

    # ── Compresión ────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1024;

    # ── Assets estáticos de Next.js (_next/static) ────────────────────────
    # Next.js los sirve desde el proceso, pero podemos cacharlos en nginx
    location /_next/static/ {
        proxy_pass http://127.0.0.1:5174;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        proxy_set_header Host $host;
    }

    # ── Archivos públicos (/public) ───────────────────────────────────────
    location /favicon.ico {
        proxy_pass http://127.0.0.1:5174;
        add_header Cache-Control "public, max-age=86400";
        proxy_set_header Host $host;
    }

    # ── Todo lo demás → Next.js SSR ───────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:5174;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
